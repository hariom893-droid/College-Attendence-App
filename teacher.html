<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Teacher Dashboard</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header class="navbar">

        <div class="brand">
            📚 SmartAttend
        </div>

        <button onclick="logout()">
            Logout
        </button>

    </header>


    <main class="dashboard">

        <h1>
            Teacher Dashboard 👨‍🏫
        </h1>

        <p>
            Mark today's attendance.
        </p>


        <!-- Selection -->

        <div class="selection-box">

            <div>

                <label>
                    Select Class
                </label>

                <select>

                    <option>
                        BCA 2nd Year
                    </option>

                    <option>
                        BCA 1st Year
                    </option>

                    <option>
                        BCA 3rd Year
                    </option>

                </select>

            </div>


            <div>

                <label>
                    Select Subject
                </label>

                <select>

                    <option>
                        Python
                    </option>

                    <option>
                        C Programming
                    </option>

                    <option>
                        Web Development
                    </option>

                    <option>
                        DBMS
                    </option>

                </select>

            </div>

        </div>


        <!-- Attendance Table -->

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>
                            Roll No.
                        </th>

                        <th>
                            Student Name
                        </th>

                        <th>
                            Attendance
                        </th>

                    </tr>

                </thead>


                <tbody>


                    <tr>

                        <td>
                            101
                        </td>

                        <td>
                            Hariom
                        </td>

                        <td>

                            <label class="attendance-option">

                                <input
                                    type="radio"
                                    name="student1"
                                    checked
                                >

                                Present

                            </label>

                            <label class="attendance-option">

                                <input
                                    type="radio"
                                    name="student1"
                                >

                                Absent

                            </label>

                        </td>

                    </tr>


                    <tr>

                        <td>
                            102
                        </td>

                        <td>
                            Rahul
                        </td>

                        <td>

                            <label class="attendance-option">

                                <input
                                    type="radio"
                                    name="student2"
                                    checked
                                >

                                Present

                            </label>

                            <label class="attendance-option">

                                <input
                                    type="radio"
                                    name="student2"
                                >

                                Absent

                            </label>

                        </td>

                    </tr>


                    <tr>

                        <td>
                            103
                        </td>

                        <td>
                            Aman
                        </td>

                        <td>

                            <label class="attendance-option">

                                <input
                                    type="radio"
                                    name="student3"
                                >

                                Present

                            </label>

                            <label class="attendance-option">

                                <input
                                    type="radio"
                                    name="student3"
                                    checked
                                >

                                Absent

                            </label>

                        </td>

                    </tr>


                    <tr>

                        <td>
                            104
                        </td>

                        <td>
                            Rohit
                        </td>

                        <td>

                            <label class="attendance-option">

                                <input
                                    type="radio"
                                    name="student4"
                                    checked
                                >

                                Present

                            </label>

                            <label class="attendance-option">

                                <input
                                    type="radio"
                                    name="student4"
                                >

                                Absent

                            </label>

                        </td>

                    </tr>


                </tbody>

            </table>

        </div>


        <button
            class="submit-attendance"
            onclick="submitAttendance()"
        >

            Submit Attendance

        </button>


    </main>


    <script src="script.js"></script>

</body>

</html>
